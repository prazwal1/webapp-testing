name: Deploy Function App (DEV)

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy-function-app.yml"

permissions:
  id-token: write   # required for OIDC login to Azure
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: function-app-dev
  AZURE_FUNCTIONAPP_PACKAGE_PATH: "api"
  PYTHON_VERSION: "3.9"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # No manual pip install here - Azure's remote build (Oryx) installs
      # dependencies from requirements.txt server-side after upload.
      # Vendoring packages here too caused the "malformed content" /
      # sync-trigger failure, since Azure ended up with two conflicting
      # sets of installed packages.

      # OIDC login - no client secret stored in GitHub. Requires a federated
      # credential set up on the Azure AD App Registration, scoped to this
      # repo + branch. See README for the one-time az cli setup.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true

      - name: Azure logout
        run: az logout
        if: always()
